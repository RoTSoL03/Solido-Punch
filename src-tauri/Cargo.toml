[package]
name = "solido-drrm-games"
version = "0.1.0"
description = "Offline diagnostic desktop build for the Solido DRRM exhibit games"
authors = ["Solido"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "solido_drrm_games_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["devtools"] }
